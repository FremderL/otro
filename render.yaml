previews:
  generation: automatic
  expireAfterDays: 3

services:
  - type: web
    name: montecristo
    runtime: node
    plan: starter
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PROFILE_STORE_PATH
        value: /var/data/profiles.json
      # Estado de la ronda compartida de la Lotería mexicana (entradas, cantos y
      # pagos pendientes). Vive en el disco persistente para sobrevivir despliegues.
      - key: LOTERIA_STATE_PATH
        value: /var/data/loteria.json
      # Diario de la Rueda de la Fortuna (apuestas, resultados y pagos). Al
      # arrancar devuelve lo apostado sin resultado y paga lo confirmado, así un
      # despliegue nunca cuesta fichas.
      - key: FORTUNE_STATE_PATH
        value: /var/data/fortune-ledger.json
      - key: LOBBY_TOURNAMENT_STORE_PATH
        value: /var/data/lobby-tournaments.json
      - key: NODE_ENV
        value: production
      # Las temporadas cierran a medianoche de Ciudad de México, no a las 00:00 UTC.
      - key: CASINO_TIME_ZONE
        value: America/Mexico_City
      # Estadio habilitado; desde noviembre 2026 los encuentros nuevos se
      # preparan automáticamente con V2 y cuotas estimadas persistidas.
      - key: FOOTBALL_ENABLED
        value: "on"
      # Persistencia de calendario, boletos y resultados del Estadio en el disco del servicio.
      - key: FOOTBALL_STORE_PATH
        value: /var/data/football.json
      # Creatividades de La Previa (imágenes aprobadas): en el disco persistente.
      - key: PROMOTION_MEDIA_DIR
        value: /var/data/promotion-media
    disk:
      name: montecristo-datos
      mountPath: /var/data
      sizeGB: 1
