previews:
  generation: automatic
  expireAfterDays: 3

services:
  - type: web
    name: montecristo
    runtime: node
    plan: starter
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PROFILE_STORE_PATH
        value: /var/data/profiles.json
      - key: NODE_ENV
        value: production
      # Las temporadas cierran a medianoche de Ciudad de México, no a las 00:00 UTC.
      - key: CASINO_TIME_ZONE
        value: America/Mexico_City
    disk:
      name: montecristo-datos
      mountPath: /var/data
      sizeGB: 1
