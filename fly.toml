# Fly.io — alternativa con egreso 7× más barato que Render ($0.02/GB en EE. UU.).
# Despliegue:  fly launch --no-deploy  (una vez)  &&  fly deploy
# Ver docs/despliegue-alternativas-render.md, opción D.
app = "montecristo"
primary_region = "dfw"   # Dallas: la región más cercana a Ciudad de México

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  CASINO_TIME_ZONE = "America/Mexico_City"
  FOOTBALL_ENABLED = "on"
  FOOTBALL_DAILY_NEWS_ENABLED = "on"
  PORT = "3000"
  # Rutas persistentes: el volumen se monta en /var/data (ver [mounts]).
  PROFILE_STORE_PATH = "/var/data/profiles.json"
  LOTERIA_STATE_PATH = "/var/data/loteria.json"
  FORTUNE_STATE_PATH = "/var/data/fortune-ledger.json"
  LOBBY_TOURNAMENT_STORE_PATH = "/var/data/lobby-tournaments.json"
  FOOTBALL_STORE_PATH = "/var/data/football.json"
  PROMOTION_MEDIA_DIR = "/var/data/promotion-media"

# Una sola máquina: las salas, los bots y los turnos viven en memoria y el
# Estadio sostiene una concesión de escritor único. No escales horizontalmente
# sin mover el estado a Redis (ver «Arquitectura» en el README).
[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"

[mounts]
  source = "montecristo_datos"
  destination = "/var/data"

[http_service]
  internal_port = 3000
  force_https = true
  # Sin auto-stop: el juego es multijugador en tiempo real y los torneos
  # dependen de que el proceso siga vivo con los sockets abiertos.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "40s"
  method = "GET"
  path = "/healthz"
