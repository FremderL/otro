<g filter="url(#sh)"><rect x="1050" y="110" width="400" height="430" rx="10" fill="#fff" stroke="#3e4c59" stroke-width="1.5"/><text x="1074" y="150" font-size="17" font-weight="bold" fill="#1f2933" text-anchor="start">Reglas de negocio del modelo</text><text x="1074" y="174" font-size="13.5" font-weight="normal" fill="#41505e" text-anchor="start">· Una sala vive mientras tenga al menos 1</text><text x="1074" y="198" font-size="13.5" font-weight="normal" fill="#41505e" text-anchor="start">  jugador conectado; se elimina al vaciarse.</text><text x="1074" y="222" font-size="13.5" font-weight="normal" fill="#41505e" text-anchor="start">· Un jugador pertenece a una sola sala activa.</text><text x="1074" y="246" font-size="13.5" font-weight="normal" fill="#41505e" text-anchor="start">· El saldo vive en jugadores: la apuesta se</text><text x="1074" y="270" font-size="13.5" font-weight="normal" fill="#41505e" text-anchor="start">  descuenta al confirmar y el pago se acredita</text><text x="1074" y="294" font-size="13.5" font-weight="normal" fill="#41505e" text-anchor="start">  al liquidar (pago = monto x multiplicador).</text><text x="1074" y="318" font-size="13.5" font-weight="normal" fill="#41505e" text-anchor="start">· partidas guarda el resultado autoritativo y</text><text x="1074" y="342" font-size="13.5" font-weight="normal" fill="#41505e" text-anchor="start">  la semilla del RNG para repetir pruebas.</text><text x="1074" y="366" font-size="13.5" font-weight="normal" fill="#41505e" text-anchor="start">· apuestas guarda la opcion elegida y el</text><text x="1074" y="390" font-size="13.5" font-weight="normal" fill="#41505e" text-anchor="start">  multiplicador aplicado: auditoria de fichas.</text><text x="1074" y="414" font-size="13.5" font-weight="normal" fill="#41505e" text-anchor="start">· Ciclo: espera - apuestas - jugando -</text><text x="1074" y="438" font-size="13.5" font-weight="normal" fill="#41505e" text-anchor="start">  resultados - nueva ronda.</text><text x="1074" y="462" font-size="13.5" font-weight="normal" fill="#41505e" text-anchor="start">· Sin dinero real: ningun campo representa</text><text x="1074" y="486" font-size="13.5" font-weight="normal" fill="#41505e" text-anchor="start">  depositos, retiros ni premios canjeables.</text></g>
