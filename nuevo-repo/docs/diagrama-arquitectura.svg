<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="880" viewBox="0 0 1500 880" font-family="DejaVu Sans">
<defs>
<filter id="sh" x="-10%" y="-10%" width="125%" height="125%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1f2933" flood-opacity="0.14"/></filter>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3e4c59"/></marker>
<marker id="ar2" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#3e4c59"/></marker>
</defs>
<rect width="1500" height="880" fill="#f6f8fa"/>
<text x="50" y="54" font-size="29" font-weight="bold" fill="#1f2933">Arquitectura y comunicacion · Casino social multijugador</text>
<text x="50" y="82" font-size="15.5" fill="#5b6b7a">Tres capas: el navegador pinta y envia intenciones, el servidor decide, la capa de datos guarda el estado.</text>
<g filter="url(#sh)"><rect x="50" y="180" width="330" height="328" rx="12" fill="#fff" stroke="#3e4c59" stroke-width="1.6"/>
<path d="M50,192 a12,12 0 0 1 12,-12 h306 a12,12 0 0 1 12,12 v34 h-330 z" fill="#2f4a7a"/>
<rect x="51" y="181" width="328" height="7" rx="3.5" fill="#4f7cff"/>
<text x="215" y="211" font-size="19" font-weight="bold" fill="#fff" text-anchor="middle">NAVEGADOR (cliente)</text><text x="215" y="242" font-size="12.5" font-style="italic" fill="#7b8896" text-anchor="middle">se ejecuta en la computadora de cada jugador</text><circle cx="72" cy="248" r="4.5" fill="#4f7cff"/><text x="86" y="253" font-size="14.5" fill="#1f2933">index.html + styles.css</text><rect x="51" y="266" width="328" height="34" fill="#eef2f6"/><circle cx="72" cy="282" r="4.5" fill="#4f7cff"/><text x="86" y="287" font-size="14.5" fill="#1f2933">app.js  (socket.io-client)</text><circle cx="72" cy="316" r="4.5" fill="#4f7cff"/><text x="86" y="321" font-size="14.5" fill="#1f2933">Pinta la sala, fichas y turnos</text><rect x="51" y="334" width="328" height="34" fill="#eef2f6"/><circle cx="72" cy="350" r="4.5" fill="#4f7cff"/><text x="86" y="355" font-size="14.5" fill="#1f2933">Canvas: ruleta, dados, moneda</text><circle cx="72" cy="384" r="4.5" fill="#4f7cff"/><text x="86" y="389" font-size="14.5" fill="#1f2933">Chat, reacciones y avisos</text><rect x="51" y="402" width="328" height="34" fill="#eef2f6"/><circle cx="72" cy="418" r="4.5" fill="#4f7cff"/><text x="86" y="423" font-size="14.5" fill="#1f2933">No decide resultados</text><circle cx="72" cy="452" r="4.5" fill="#4f7cff"/><text x="86" y="457" font-size="14.5" fill="#1f2933">Estado local = copia del servidor</text></g>
<g filter="url(#sh)"><rect x="600" y="130" width="366" height="362" rx="12" fill="#fff" stroke="#3e4c59" stroke-width="1.6"/>
<path d="M600,142 a12,12 0 0 1 12,-12 h342 a12,12 0 0 1 12,12 v34 h-366 z" fill="#22564a"/>
<rect x="601" y="131" width="364" height="7" rx="3.5" fill="#2fbf87"/>
<text x="783" y="161" font-size="19" font-weight="bold" fill="#fff" text-anchor="middle">SERVIDOR  Node.js</text><text x="783" y="192" font-size="12.5" font-style="italic" fill="#7b8896" text-anchor="middle">autoridad unica del juego</text><circle cx="622" cy="198" r="4.5" fill="#2fbf87"/><text x="636" y="203" font-size="14.5" fill="#1f2933">Express: archivos y REST</text><rect x="601" y="216" width="364" height="34" fill="#eef2f6"/><circle cx="622" cy="232" r="4.5" fill="#2fbf87"/><text x="636" y="237" font-size="14.5" fill="#1f2933">Socket.IO: salas y eventos</text><circle cx="622" cy="266" r="4.5" fill="#2fbf87"/><text x="636" y="271" font-size="14.5" fill="#1f2933">Motor de juego (reglas)</text><rect x="601" y="284" width="364" height="34" fill="#eef2f6"/><circle cx="622" cy="300" r="4.5" fill="#2fbf87"/><text x="636" y="305" font-size="14.5" fill="#1f2933">RNG + liquidacion de pagos</text><circle cx="622" cy="334" r="4.5" fill="#2fbf87"/><text x="636" y="339" font-size="14.5" fill="#1f2933">Validacion: turno, fase, saldo</text><rect x="601" y="352" width="364" height="34" fill="#eef2f6"/><circle cx="622" cy="368" r="4.5" fill="#2fbf87"/><text x="636" y="373" font-size="14.5" fill="#1f2933">Temporizadores de turno</text><circle cx="622" cy="402" r="4.5" fill="#2fbf87"/><text x="636" y="407" font-size="14.5" fill="#1f2933">Difunde el estado a la sala</text><rect x="601" y="420" width="364" height="34" fill="#eef2f6"/><circle cx="622" cy="436" r="4.5" fill="#2fbf87"/><text x="636" y="441" font-size="14.5" fill="#1f2933">Nunca manda cartas ajenas</text></g>
<g filter="url(#sh)"><rect x="1120" y="250" width="330" height="260" rx="12" fill="#fff" stroke="#3e4c59" stroke-width="1.6"/>
<path d="M1120,262 a12,12 0 0 1 12,-12 h306 a12,12 0 0 1 12,12 v34 h-330 z" fill="#6b5410"/>
<rect x="1121" y="251" width="328" height="7" rx="3.5" fill="#d9a441"/>
<text x="1285" y="281" font-size="19" font-weight="bold" fill="#fff" text-anchor="middle">CAPA DE DATOS</text><text x="1285" y="312" font-size="12.5" font-style="italic" fill="#7b8896" text-anchor="middle">persistencia del estado</text><circle cx="1142" cy="318" r="4.5" fill="#d9a441"/><text x="1156" y="323" font-size="14.5" fill="#1f2933">Memoria: Map(salas, jugadores)</text><rect x="1121" y="336" width="328" height="34" fill="#eef2f6"/><circle cx="1142" cy="352" r="4.5" fill="#d9a441"/><text x="1156" y="357" font-size="14.5" fill="#1f2933">Snapshot JSON (opcional)</text><circle cx="1142" cy="386" r="4.5" fill="#d9a441"/><text x="1156" y="391" font-size="14.5" fill="#1f2933">data/estado.json al apagar</text><rect x="1121" y="404" width="328" height="34" fill="#eef2f6"/><circle cx="1142" cy="420" r="4.5" fill="#d9a441"/><text x="1156" y="425" font-size="14.5" fill="#1f2933">PostgreSQL (opcional, futuro)</text><circle cx="1142" cy="454" r="4.5" fill="#d9a441"/><text x="1156" y="459" font-size="14.5" fill="#1f2933">Sin datos sensibles ni pagos</text></g>
<path d="M380,300 L600,300" fill="none" stroke="#3e4c59" stroke-width="2.4"  marker-end="url(#ar)"/>
<circle cx="490" cy="266" r="15" fill="#4f7cff"/><text x="490" y="272" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">1</text>
<text x="490" y="288" font-size="15" font-weight="bold" fill="#2f4a7a" text-anchor="middle">HTTP</text>
<text x="490" y="322" font-size="12" font-weight="normal" fill="#3e4c59" text-anchor="middle">GET / → HTML, CSS, JS</text>
<text x="490" y="340" font-size="12" font-weight="normal" fill="#3e4c59" text-anchor="middle">GET /api/salas</text>
<path d="M380,500 L600,500" fill="none" stroke="#3e4c59" stroke-width="2.4" marker-start="url(#ar2)" marker-end="url(#ar)"/>
<circle cx="490" cy="466" r="15" fill="#2fbf87"/><text x="490" y="472" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">2</text>
<text x="490" y="488" font-size="15" font-weight="bold" fill="#22564a" text-anchor="middle">WebSocket (Socket.IO)</text>
<text x="490" y="522" font-size="12" font-weight="normal" fill="#3e4c59" text-anchor="middle">sube: unirse, apostar</text>
<text x="490" y="538" font-size="12" font-weight="normal" fill="#3e4c59" text-anchor="middle">hit, plantarse, retirarse</text>
<text x="490" y="556" font-size="12" font-weight="normal" fill="#3e4c59" text-anchor="middle">baja: estado de la sala</text>
<text x="490" y="572" font-size="12" font-weight="normal" fill="#3e4c59" text-anchor="middle">turno y resultado</text>
<path d="M966,470 L1120,470" fill="none" stroke="#3e4c59" stroke-width="2.4" marker-start="url(#ar2)" marker-end="url(#ar)"/>
<circle cx="1043" cy="430" r="15" fill="#d9a441"/><text x="1043" y="436" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">3</text>
<text x="1043" y="454" font-size="13" font-weight="bold" fill="#6b5410" text-anchor="middle">lectura/escritura</text>
<text x="1043" y="492" font-size="12" font-weight="normal" fill="#3e4c59" text-anchor="middle">salas, jugadores,</text>
<text x="1043" y="508" font-size="12" font-weight="normal" fill="#3e4c59" text-anchor="middle">partidas, apuestas</text>
<rect x="50" y="760" width="1400" height="80" rx="10" fill="#fff" stroke="#3e4c59" stroke-width="1.4" filter="url(#sh)"/>
<text x="76" y="792" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="start">Regla de oro: el servidor es autoritativo.</text>
<text x="76" y="816" font-size="13.5" font-weight="normal" fill="#41505e" text-anchor="start">El navegador solo envia la intencion del jugador y dibuja la respuesta. El resultado (numero, carta, dado o ganador) se genera y se liquida siempre en el servidor,</text>
<text x="76" y="836" font-size="13.5" font-weight="normal" fill="#41505e" text-anchor="start">con las reglas y los multiplicadores de docs/02-reglas-y-pagos.md. Ningun cliente puede adelantar, repetir ni alterar un resultado.</text>
<text x="50" y="862" font-size="12.5" font-weight="normal" fill="#7b8896" text-anchor="start">Fuente editable: docs/diagrama-arquitectura.svg</text>
</svg>