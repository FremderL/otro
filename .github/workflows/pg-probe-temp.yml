name: PG probe (temp)
on: push
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: montecristo_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Test 22 aislado
        env:
          FOOTBALL_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/montecristo_test?sslmode=disable
          NODE_ENV: test
          LOG_JSON: 'off'
        run: |
          node --test --test-name-pattern="V2 oficial progresiva conserva" tests/football-v2-pg-real.test.js > /tmp/t22.log 2>&1 || true
          echo "exit22=$?"
          grep -nE "not ok|error|Error|expected|actual|at .*football-v2-pg-real|markets" /tmp/t22.log | head -12 | while IFS= read -r l; do echo "::error::T22 $l"; done
      - name: Caso de mercado en frío (repro local del bug)
        run: |
          node -e "
          (async () => {
            const { FootballStore } = require('./lib/football-store');
            const { createOfficialV2 } = require('./lib/football/v2/official');
            const { createBettingService } = require('./lib/football/betting');
            const fs = require('fs'), os = require('os'), path = require('path');
            const store = new FootballStore(path.join(fs.mkdtempSync(path.join(os.tmpdir(), 'fm-')), 'f.json'));
            store.v2Only = true;
            store.generateSeason('2026-10');
            store.closeSeason('2026-10');
            const league = store.generateSeason('2026-11');
            const now = Math.min(...league.calendar.matches.map(m => m.scheduledKickoffAt)) - 60000;
            const v2 = createOfficialV2({ store, now: () => now });
            await v2.ensureSeason('2026-11');
            const betting = createBettingService({ store, officialV2: v2, now: () => now });
            const snap = betting.futureMarket.getMarket('2026-11');
            if (!snap) { console.log('::error::SIN MERCADO en frío'); process.exit(1); }
            console.log('mercado ok, cuotas:', snap.markets.champion.length, 'sourceId', snap.sourceId);
          })().catch(e => { console.log('::error::' + e.message); process.exit(1); });
          "
      - name: Test 19 aislado
        env:
          FOOTBALL_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/montecristo_test?sslmode=disable
          NODE_ENV: test
          LOG_JSON: 'off'
        run: |
          node --test --test-name-pattern="dos servidores con Estadio activo" tests/football-v2-pg-real.test.js > /tmp/t19.log 2>&1 || true
          echo "exit19=$?"
          grep -nE "not ok|Tiempo agotado|El servidor terminó|otra instancia|writer|Estadio" /tmp/t19.log | head -12 | while IFS= read -r l; do echo "::error::T19 $l"; done
