name: PG probe (temp)
on: push
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: montecristo_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Test 22 aislado
        env:
          FOOTBALL_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/montecristo_test?sslmode=disable
          NODE_ENV: test
          LOG_JSON: 'off'
        run: |
          node --test --test-name-pattern="V2 oficial progresiva conserva" tests/football-v2-pg-real.test.js > /tmp/t22.log 2>&1 || true
          echo "exit22=$?"
          grep -nE "not ok|error|Error|expected|actual|at .*football-v2-pg-real|markets" /tmp/t22.log | head -12 | while IFS= read -r l; do echo "::error::T22 $l"; done
      - name: Sonda del guard de getMarket sobre PG
        env:
          FOOTBALL_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/montecristo_test?sslmode=disable
          NODE_ENV: test
        run: node scripts/tmp-pg-probe.js || true
      - name: ¿Acepta pg el parámetro options en la URL?
        env:
          FOOTBALL_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/montecristo_test?sslmode=disable
        run: |
          node -e "
          const { Client } = require('pg');
          const BASE = process.env.FOOTBALL_TEST_DATABASE_URL;
          (async () => {
            for (const extra of ['', (BASE.includes('?') ? '&' : '?') + new globalThis.URLSearchParams({ options: '-c search_path=pg_catalog' })]) {
              const c = new Client({ connectionString: BASE + extra });
              try { await c.connect(); const r = await c.query('select current_setting(\'search_path\') as sp'); console.log('::error::OPT ok extra=' + JSON.stringify(extra) + ' sp=' + r.rows[0].sp); }
              catch (e) { console.log('::error::OPT FALLO extra=' + JSON.stringify(extra) + ' ' + e.message); }
              try { await c.end(); } catch (_) {}
            }
          })().catch(e => console.log('::error::OPT ' + e.message));
          "
      - name: Arranque del primer servidor PG (informe de stack)
        env:
          FOOTBALL_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/montecristo_test?sslmode=disable
          NODE_ENV: test
        run: node scripts/tmp-bootprobe.js
