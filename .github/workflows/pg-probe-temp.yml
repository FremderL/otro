name: PG probe (temp)
on: push
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: montecristo_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Test 22 aislado
        env:
          FOOTBALL_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/montecristo_test?sslmode=disable
          NODE_ENV: test
          LOG_JSON: 'off'
        run: |
          node --test --test-name-pattern="V2 oficial progresiva conserva" tests/football-v2-pg-real.test.js > /tmp/t22.log 2>&1 || true
          echo "exit22=$?"
          grep -nE "not ok|error|Error|expected|actual|at .*football-v2-pg-real|markets" /tmp/t22.log | head -12 | while IFS= read -r l; do echo "::error::T22 $l"; done
      - name: Sonda del guard de getMarket sobre PG
        env:
          FOOTBALL_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/montecristo_test?sslmode=disable
          NODE_ENV: test
        run: node scripts/tmp-pg-probe.js || true
      - name: Arranque del primer servidor PG (traza)
        env:
          FOOTBALL_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/montecristo_test?sslmode=disable
          NODE_ENV: test
        run: |
          node -e "
          const { randomUUID } = require('node:crypto');
          const { spawn } = require('node:child_process');
          const { Pool } = require('pg');
          const fs = require('fs'), os = require('os'), path = require('path');
          (async () => {
            const URL = process.env.FOOTBALL_TEST_DATABASE_URL;
            const schema = 'w_' + randomUUID().replace(/-/g, '');
            const admin = new Pool({ connectionString: URL });
            await admin.query('CREATE SCHEMA ' + schema);
            const dbUrl = URL + (URL.includes('?') ? '&' : '?') + new URLSearchParams({ options: '-c search_path=' + schema });
            const dir = fs.mkdtempSync(path.join(os.tmpdir(), 'wtr-'));
            const env = { ...process.env, DATABASE_URL: dbUrl, FOOTBALL_ENABLED: 'on', NODE_ENV: 'test',
              FOOTBALL_WRITER_WAIT_MS: '3000', LOG_JSON: 'off', LOTERIA_ENABLED: 'off', FORTUNE_ENABLED: 'off',
              AUTO_BOTS: 'off', SHUTDOWN_GRACE_MS: '100', PROMOTION_MEDIA_DIR: dir,
              PROFILE_STORE_PATH: path.join(dir, 'p.json'), FOOTBALL_STORE_PATH: path.join(dir, 'f.json'),
              COMMUNITY_STORE_PATH: path.join(dir, 'c.json'), LOBBY_TOURNAMENT_STORE_PATH: path.join(dir, 't.json') };
            delete env.PORT;
            const child = spawn(process.execPath, ['server.js'], { cwd: process.cwd(), env, stdio: ['ignore', 'pipe', 'pipe'] });
            let text = '';
            child.stdout.on('data', c => { text += c; });
            child.stderr.on('data', c => { text += c; });
            const deadline = Date.now() + 25000;
            while (Date.now() < deadline && !/MonteCristo lista/.test(text) && child.exitCode === null) {
              await new Promise(r => setTimeout(r, 200));
            }
            if (!/MonteCristo lista/.test(text)) {
              const lines = text.split('\n').map(l => l.replace(/::/g, ':·'));
              for (const line of lines.slice(0, 12)) console.log('::error::BOOT ' + line);
              console.log('::error::BOOT salida=' + child.exitCode);
            } else console.log('::error::BOOT escuchó bien');
            child.kill('SIGKILL');
            await admin.query('DROP SCHEMA ' + schema + ' CASCADE');
            await admin.end();
            fs.rmSync(dir, { recursive: true, force: true });
          })().catch(e => console.log('::error::BOOT FALLO ' + e.message));
          "
