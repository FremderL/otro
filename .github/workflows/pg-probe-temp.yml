name: PG probe (temp)
on: push
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: montecristo_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Test 22 aislado
        env:
          FOOTBALL_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/montecristo_test?sslmode=disable
          NODE_ENV: test
          LOG_JSON: 'off'
        run: |
          node --test --test-name-pattern="V2 oficial progresiva conserva" tests/football-v2-pg-real.test.js > /tmp/t22.log 2>&1
          echo "exit22=$?"
          grep -nE "not ok|error|Error|expected|actual|at .*football-v2-pg-real|markets" /tmp/t22.log | head -12 | while IFS= read -r l; do echo "::error::T22 $l"; done
      - name: Test 19 aislado
        env:
          FOOTBALL_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/montecristo_test?sslmode=disable
          NODE_ENV: test
          LOG_JSON: 'off'
        run: |
          node --test --test-name-pattern="dos servidores con Estadio activo" tests/football-v2-pg-real.test.js > /tmp/t19.log 2>&1
          echo "exit19=$?"
          grep -nE "not ok|Tiempo agotado|El servidor terminó|otra instancia|writer|Estadio" /tmp/t19.log | head -12 | while IFS= read -r l; do echo "::error::T19 $l"; done
