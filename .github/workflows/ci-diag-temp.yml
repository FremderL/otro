name: Diagnóstico temporal (borrar)
on: push
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Integración (3 intentos, mismo entorno que CI)
        run: |
          for i in 1 2 3; do
            echo "===== INTENTO $i ====="
            NODE_ENV=test LOG_JSON=off DATABASE_URL='' npm run test:integration > /tmp/out$i.txt 2>&1
            echo "exit=$?"
          done
          node -e "
          const fs=require('fs');
          const esc=s=>s.replace(/%/g,'%25').replace(/\r/g,'%0D').replace(/\n/g,'%0A');
          for (const i of [1,2,3]) {
            const lines=fs.readFileSync('/tmp/out'+i+'.txt','utf8').split('\n');
            const resumen=lines.filter(l=>/^# (tests|pass|fail|skipped) /.test(l)).join(' | ');
            console.log('::notice title=INTENTO '+i+'::'+esc(resumen));
            let shots=0;
            for(let k=0;k<lines.length && shots<3;k++){
              if(/^not ok /.test(lines[k])){
                const ctx=lines.slice(k,Math.min(k+10,lines.length)).join('\n');
                console.log('::error title=FALLO intento '+i+'::'+esc(ctx.slice(0,900)));
                shots++;
              }
            }
          }
          "
