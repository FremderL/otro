name: unit-probe-temp
on: push
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Unitarios (solo nombres de fallos)
        env:
          NODE_ENV: test
          LOG_JSON: 'off'
        run: |
          npm run test:unit > /tmp/unit.log 2>&1 || true
          grep -c "^ok" /tmp/unit.log
          grep -n "^not ok" /tmp/unit.log | head -9 | sed 's/::/:/g' | while IFS= read -r line; do echo "::error::UNIT $line"; done
          tail -8 /tmp/unit.log | tr '\n' ' ' | cut -c1-300 | sed 's/^/::error::TAIL /'
