name: unit-probe-temp
on: push
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Integración (solo nombres de fallos)
        env:
          NODE_ENV: test
          LOG_JSON: 'off'
        run: |
          npm run test:integration > /tmp/int.log 2>&1 || true
          grep -n "^not ok" /tmp/int.log | head -8 | sed 's/::/:/g' | while IFS= read -r line; do echo "::error::INT $line"; done
          grep -n "not ok" /tmp/int.log | head -8 | sed 's/::/:/g' | head -8 | while IFS= read -r line; do echo "::error::INT2 $line"; done
          tail -8 /tmp/int.log | tr '\n' ' ' | cut -c1-300 | sed 's/^/::error::TAIL /'
