name: Admin security
on:
  pull_request:
  push:
    branches: [main, 'arena/**']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: montecristo
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: montecristo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U montecristo -d montecristo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://montecristo:test-only-password@localhost:5432/montecristo_test?sslmode=disable
      ALLOW_DATABASE_TESTS: 'true'
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev
      - run: npm test
      - run: npm run test:postgres
      - run: npm audit --audit-level=high
