<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">Lotería mexicana en MonteCristo</title>
<desc id="desc">Ilustración original de cartas, fichas y un tablero sobre una mesa verde.</desc>
<defs>
 <linearGradient id="felt" x2="1" y2="1"><stop stop-color="#102e29"/><stop offset=".55" stop-color="#245345"/><stop offset="1" stop-color="#091b1a"/></linearGradient>
 <radialGradient id="light"><stop stop-color="#d8b16b" stop-opacity=".34"/><stop offset="1" stop-color="#d8b16b" stop-opacity="0"/></radialGradient>
 <linearGradient id="card" x2="1" y2="1"><stop stop-color="#fff1cb"/><stop offset="1" stop-color="#c9a573"/></linearGradient>
 <filter id="shadow" x="-40%" y="-40%" width="180%" height="200%"><feGaussianBlur stdDeviation="12"/></filter>
 <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#e1c485" opacity=".2"/></pattern>
</defs>
<rect width="1200" height="800" fill="url(#felt)"/><rect width="1200" height="800" fill="url(#dots)"/><ellipse cx="605" cy="300" rx="620" ry="550" fill="url(#light)"/>
<path d="M0 625 Q620 550 1200 650 L1200 800 H0Z" fill="#071815" opacity=".45"/>
<!-- Cartón original de cuatro por cuatro; las imágenes no reproducen naipes existentes. -->
<g transform="translate(230 130) rotate(-8 360 260)">
 <rect x="10" y="20" width="720" height="522" rx="18" fill="#000" opacity=".5" filter="url(#shadow)"/>
 <rect width="720" height="520" rx="18" fill="url(#card)" stroke="#ead29d" stroke-width="8"/>
 <rect x="19" y="19" width="682" height="482" rx="8" fill="#244e40" stroke="#755a36" stroke-width="4"/>
 <g fill="#e1c994" stroke="#ab8757" stroke-width="3">
  <path d="M34 36h150v102H34z M201 36h150v102H201z M368 36h150v102H368z M535 36h150v102H535z M34 151h150v102H34z M201 151h150v102H201z M368 151h150v102H368z M535 151h150v102H535z M34 266h150v102H34z M201 266h150v102H201z M368 266h150v102H368z M535 266h150v102H535z M34 381h150v102H34z M201 381h150v102H201z M368 381h150v102H368z M535 381h150v102H535z"/>
 </g>
 <g text-anchor="middle" font-family="Georgia,serif" font-weight="bold" font-size="43" fill="#a34636">
  <text x="109" y="104">✺</text><text x="276" y="104" fill="#295f4b">♣</text><text x="443" y="104">♥</text><text x="610" y="104" fill="#395b6a">☾</text>
  <text x="109" y="219" fill="#395b6a">✦</text><text x="276" y="219">◆</text><text x="443" y="219" fill="#295f4b">♠</text><text x="610" y="219">✿</text>
  <text x="109" y="334">☀</text><text x="276" y="334" fill="#395b6a">✧</text><text x="443" y="334">♥</text><text x="610" y="334" fill="#295f4b">♣</text>
  <text x="109" y="449" fill="#295f4b">♠</text><text x="276" y="449">✿</text><text x="443" y="449" fill="#395b6a">☾</text><text x="610" y="449">✺</text>
 </g>
 <g fill="#b55741" stroke="#f6d8a0" stroke-width="3"><ellipse cx="104" cy="79" rx="20" ry="16"/><ellipse cx="440" cy="194" rx="20" ry="16"/><ellipse cx="275" cy="310" rx="20" ry="16"/><ellipse cx="605" cy="426" rx="20" ry="16"/></g>
</g>
<!-- Cartas sueltas y fichas: elementos decorativos, sin resultados simulados. -->
<g transform="translate(810 213) rotate(13 125 180)">
 <rect x="10" y="14" width="250" height="345" rx="12" fill="#000" opacity=".45" filter="url(#shadow)"/>
 <rect width="250" height="345" rx="12" fill="url(#card)" stroke="#f0dbaa" stroke-width="8"/>
 <rect x="20" y="20" width="210" height="255" fill="#a34839" stroke="#dbb778" stroke-width="5"/>
 <circle cx="125" cy="146" r="64" fill="#e4bb73"/><circle cx="125" cy="146" r="45" fill="#ba613b"/>
 <path d="M125 65v-20 M125 227v20 M44 146H24 M206 146h20 M68 89 53 74 M182 203l15 15 M68 203l-15 15 M182 89l15-15" stroke="#f3d79b" stroke-width="9" stroke-linecap="round"/>
 <text x="125" y="318" text-anchor="middle" fill="#4d392b" font-family="Georgia,serif" font-weight="bold" font-size="23" letter-spacing="3">EL SOL</text>
</g>
<g fill="#bf5b43" stroke="#f0ce8f" stroke-width="4"><ellipse cx="883" cy="648" rx="32" ry="24"/><ellipse cx="947" cy="674" rx="27" ry="20"/><ellipse cx="1032" cy="622" rx="30" ry="22"/></g>
<path d="M58 70h160 M58 70v94 M1142 70H982 M1142 70v94 M58 734h160 M58 734v-94 M1142 734H982 M1142 734v-94" fill="none" stroke="#e4c58a" stroke-width="3" opacity=".48"/>
