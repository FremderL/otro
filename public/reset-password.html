<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Restablecer contraseña</title><link rel="stylesheet" href="/styles.css"></head><body><main class="modal-card password-reset-card"><h1>Restablecer contraseña</h1><p>El enlace funciona una sola vez y expira en 15 minutos.</p><form id="reset-form"><label>Nueva contraseña<input id="password" type="password" minlength="10" maxlength="128" autocomplete="new-password" required></label><label>Confirmar contraseña<input id="confirm" type="password" minlength="10" maxlength="128" autocomplete="new-password" required></label><p id="status" role="alert"></p><button class="btn btn-primary" type="submit">Guardar contraseña</button></form></main><script src="/reset-password.js" defer></script></body></html>
